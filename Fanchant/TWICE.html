<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TWICE Fan Chant</title>
    <link rel="stylesheet" href="song.css">
    <script src="register-sw.js"></script>
    <style>
        :root {
            --theme-main: #FF5FA2;   /* 主色：歌名文字、應援詞、連結 */
            --theme-light: #FDE7EF; /* 內容區底色 (淺) */
            --theme-bg: #eefbd5;    /* 備用底色 */
        }
    </style>
</head>
<body>

    <!-- 1. 歌曲選單 -->
    <div class="fixed-top-bar">
   
        <div class="filter-container">
            <a href="index.html" class="home-btn">← 返回主頁</a>

        <!-- 選項現在由 TWICE.js 的 initFilter() 依 songDatabase 自動產生，
             之後在 songDatabase 加新歌，這裡不用手動同步新增 <option> -->
        <select id="songSelect" onchange="filterSong()"></select>
     </div>


    <!-- 2. 歌名切換控制列 -->
    <div class="song-control-bar">
        <button class="nav-btn" onclick="prevSong()">❮</button>
        <div class="song-title-wrapper">
            <span class="artist-name" id="artist-name">TWICE</span>
            <h1 id="song-title">Like OOH-AHH</h1>
        </div>
        <button class="nav-btn" onclick="nextSong()">❯</button>
    </div>
</div>
     

    <!-- 3. 自己的內容區 (支援左右滑動切換) -->
    <div class="content-container" id="content-container">
        <!-- 影片區 -->
        <div class="video-wrapper" id="video-area">
            <!-- 動態插入 YouTube iframe -->
        </div>

        <!-- 應援與歌詞區 -->
        <div class="lyrics-wrapper" id="lyrics-area">
            <!-- 動態插入歌詞與應援 -->
        </div>
    </div>

    <script src="TWICE.js"></script>
</body>
</html>
