<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>FANCHANT</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <nav class="navbar">
        <div class="logo">KPOP Cheering Guide</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="搜尋團體...">
            <select id="groupSelect">
                <option value="all">全部團體</option>
                
                <option value="BTS">BTS</option>
                <option value="EXO">EXO</option>
                
                <option value="ITZY">ITZY</option>
                
                <!-- <option value="KISS">KISS OF LIFE</option> -->
                
                <option value="twice">TWICE</option>
                

            </select>
        </div>
    </nav>

    <main class="grid" id="cardGrid">
        <div class="song-card" data-group="" style="--group-color: #2ecfb7 ;" onclick="location.href='關於本站.html'">
            <div class="card-artist">About</div>
            <h2 class="card-title">關於本站</h2>
            <div class="card-arrow">GO TO GUIDE →</div>
        </div>

        <div class="song-card" data-group="" style="--group-color: #6707ab ;" onclick="location.href='使用教學.html'">
            <div class="card-artist">HELLO</div>
            <h2 class="card-title">使用教學</h2>
            <div class="card-arrow">GO TO GUIDE →</div>
        </div>

        <div class="song-card" data-group="" style="--group-color: #f83b70 ;" onclick="location.href='聲明.html'">
            <div class="card-artist">NOTICE</div>
            <h2 class="card-title">聲明</h2>
            <div class="card-arrow">GO TO GUIDE →</div>
        </div>

        <div class="song-card" data-group="twice" onclick="location.href='TWICE.html'">
            <div class="card-artist">JYP Entertainment</div>
            <h2 class="card-title" style="color:#FF5FA2;">TWICE</h2>
            <div class="card-arrow">JYP~(氣音) →</div>
        </div>

        <div class="song-card" data-group="BTS" onclick="location.href='BTS.html'">
            <div class="card-artist">HYPE Entertainment/BIG HIT MUSIC</div>
            <h2 class="card-title" style="color:#dd63e1;">BTS</h2>
            <div class="card-arrow">GO TO GUIDE →</div>
        </div>

        <div class="song-card" data-group="EXO" onclick="location.href='EXO.html'">
            <div class="card-artist">SM Entertainment</div>
            <h2 class="card-title" style="color:#C0C0C0;">EXO</h2>
            <div class="card-arrow">GO TO GUIDE →</div>
        </div>

        <div class="song-card" data-group="ITZY" onclick="location.href='ITZY.html'">
            <div class="card-artist">JYP Entertainment</div>
            <h2 class="card-title" style="color:#FF1744;">ITZY</h2>
            <div class="card-arrow">GO TO GUIDE →</div>
        </div>

        <!-- <div class="song-card" data-group="KISS" style="--group-color: #FF2a2a ;" onclick="location.href='KISS_OF_LIFE/Shh.html'">
            <div class="card-artist">KISS OF LIFE</div>
            <h2 class="card-title">Shhh</h2>
            <div class="card-arrow">GO TO GUIDE →</div>
        </div> -->

           
    </main>

   <script src="script.js" defer></script>
</body>
</html>
