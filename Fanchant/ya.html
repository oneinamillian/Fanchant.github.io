<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>...</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap');

        body {
            background-color: #ffffff;
            color: #000000;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }

        .header {
            padding: 60px 8%;
            border-bottom: 2px solid #000;
        }

        .back-link {
            text-decoration: none;
            color: #000;
            font-weight: 700;
            font-size: 0.9rem;
            border: 2px solid #000;
            padding: 8px 16px;
            transition: all 0.2s;
        }

        .back-link:hover { background: #000; color: #fff; }

        .title-group {
            margin-top: 40px;
            display: flex;          /* 啟用彈性佈局 */
            flex-direction: column; /* 讓內容由上而下排列 */
            align-items: center;    /* 水平置中所有子元素 */
            text-align: center;     /* 確保多行文字時也能內部置中 */
        }

        /* 為了讓視覺更完美，建議微調這兩個原有的樣式 */
        .artist {
            font-weight: 400;
            letter-spacing: 4px;
            color: #666;
            margin-bottom: 8px;    /* 增加一點跟標題之間的距離 */
        }

        .song {
            font-size: 6rem;
            font-weight: 900;
            margin: 0;
            line-height: 1.1;      /* 置中時稍微調大行高，避免字母擠在一起 */
        }

        /* 影片區塊 */
        .video-wrapper {
            padding: 60px 8% 20px 8%;
            display: flex;
            justify-content: center;
        }

        .video-box {
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16/9;
            border: 4px solid #000; /* 顯眼的邊框 */
            box-shadow: 15px 15px 0px #f0f0f0;
        }

        .video-box iframe { width: 100%; height: 100%; border: none; }

        /* 歌詞內容區 */
        .lyrics-body {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px 20px 100px 20px;
        }

        .lyric-item {
            margin-bottom: 60px;
            border-left: 5px solid #eee; /* 左側裝飾線條 */
            padding-left: 30px;
        }

        .romaji { color: #888; font-size: 1rem; margin-bottom: 8px; }
        .kana { font-size: 2.2rem; font-weight: 900; margin: 0; line-height: 1.2; }

        /* 應援重點標記 */
        mark {
            background: linear-gradient( #ffff00 0%); /* 現代感螢光筆 */
            color: inherit;
            padding: 0 4px;
            border-radius: 2px;
        }

        u { border-bottom: 3px solid #ffff00; text-decoration: none; }

        .tip {
            display: inline-block;    /* 改為 inline-block，框線才會緊貼文字長度而非撐滿整行 */
            margin-top: 15px;
            padding: 4px 14px;        /* 增加內距，讓文字在框內有呼吸空間 */
            font-size: 0.85rem;       /* 稍微縮小字體，增加精緻感 */
            font-weight: 700;
            color: #505357;
            text-transform: uppercase;
            letter-spacing: 1px;      /* 增加字距，讓大寫字母不擁擠 */
            
            /* 圓弧外框核心代碼 */
            border: 1.5px solid #d1d4d7; /* 使用比文字淺一點的灰色，外觀更高端 */
            border-radius: 50px;         /* 設定極大的圓角，形成「膠囊型」外框 */
            background-color: #f8f9fa;   /* 淡淡的背景色，讓框線看起來更實心、有質感 */
        }
        @media (max-width: 768px) {
        /* 歌手名稱：不宜太大，保持點綴感 */
        .artist {
            font-size: 0.8rem;
            letter-spacing: 3px;
        }

        /* 歌曲標題：使用 clamp 讓它在不同螢幕自動縮放，最大不超過 3.5rem */
        .song {
            font-size: clamp(2.5rem, 10vw, 3.5rem);
            line-height: 1.1;
        }

        /* 空耳/讀音歌詞：這是最重要的部分，建議加大 */
        .kana, .pronunciation {
            font-size: 1.6rem; /* 這是手機閱讀最舒適的大標級別 */
            font-weight: 900;
            line-height: 1.3;
            margin: 5px 0;
        }

        /* 原文歌詞：輔助性質，縮小並變淡 */
        .romaji, .original {
            font-size: 0.9rem;
            color: #888;
        }

        /* 圓弧提示標籤 (Tip)：字體稍微縮小，但維持外框明顯 */
        .tip {
            font-size: 0.75rem;
            padding: 3px 10px;
        }
    }
    </style>
</head>
<body>

    <header class="header">
        <a href="index.html" class="back-link">Back to Gallery</a>
        <div class="title-group">
            <h1 class="song">施工中...</h1>
        </div>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </header>
</body>
</html>
