<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>應援聲明</title>
    <style>
        :root {
            --main-blue: #f83b70;
            --bg-color: #ffffff;
        }

        body {
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            color: #333;
            line-height: 1.8;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 700px;
            border: 2px solid #000;
            padding: 40px;
            box-shadow: 10px 10px 0px var(--main-blue); /* 延續你的厚陰影風格 */
        }

        h1 {
            color: var(--main-blue);
            border-bottom: 3px solid #000;
            padding-bottom: 10px;
            margin-top: 0;
        }

        .notice-item {
            margin-bottom: 25px;
        }

        .notice-item b {
            color: var(--main-blue);
            font-size: 1.1rem;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #000;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .back-btn:hover {
            background-color: var(--main-blue);
            transform: translate(-3px, -3px);
            box-shadow: 4px 4px 0px #ccc;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>NOTICE / 聲明</h1>
        
        <div class="notice-item">
            <b>01. 非營利聲明</b><br>
            本站為純粉絲自發性質之網頁，僅供應援教學與交流使用，<b>不包含任何商業盈利行為</b>。
        </div>

        <div class="notice-item">
            <b>02. 版權說明</b><br>
            本站所引用之影音素材、歌詞、藝人肖像及官方商標，其版權均歸屬於原公司及原創作者所有。本站不擁有上述素材之版權，若有侵權請告知，將立即刪除。
        </div>

        <div class="notice-item">
            <b>03. 內容轉載</b><br>
            歡迎轉載本站教學連結。本站自製之 CSS 設計與整理內容，轉載時請註明出處。
        </div>

        <div class="notice-item">
            <b>04. 免責聲明</b><br>
            本站提供之資訊僅供參考，對於外部連結（如 YouTube）之內容與安全性概不負責。
        </div>

        <a href="index.html" class="back-btn">← 回到主頁</a>
    </div>

</body>
</html>
